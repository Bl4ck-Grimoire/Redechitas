server {
    listen 80;
    server_name _; 
    #se puede configurar para resolver nuestro dominio 
    resolver 127.0.0.11 valid=10s;
    root /usr/share/nginx/html;
    #carpeta donde estan los html
    index index.html;
    #ntml principal (index)

    # Archivos estaticos
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
    #intenta servir el archivo de la url

    # Proxy inverso -> HAProxy en MV1 
    # Todas las llamadas /api/* del navegador se reenvian a HAProxy,
    # que a su vez enruta al microservicio correcto.
    location /api/ {
        proxy_pass         http://haproxy:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Cache para assets estaticos 
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1d;
        add_header Cache-Control "public";
    }


    # Logs 
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;
}
