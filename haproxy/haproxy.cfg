global
    log stdout format raw local0
    maxconn 100000

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    retries 3
    timeout connect 5s
    timeout client  60s
    timeout server  120s

# DNS interno de Docker Swarm
resolvers docker_dns
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      10s

# ── Stats ─────────────────────────────────────────────────────────────────────

frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-legends
    stats show-node

# ── HTTP Frontend  –  enrutamiento por prefijo de ruta ────────────────────────

frontend http_front
    bind *:80

    # MS1 – Usuarios
    acl is_ms1  path_beg /api/login
    acl is_ms1  path_beg /api/usuarios

    # MS2 – Propiedades
    acl is_ms2  path_beg /api/conjuntos
    acl is_ms2  path_beg /api/torres
    acl is_ms2  path_beg /api/apartamentos
    acl is_ms2  path_beg /api/parqueaderos

    # MS3 – Gestión
    acl is_ms3  path_beg /api/gestiones
    acl is_ms3  path_beg /api/pagos

    # MS4 – Analytics 
    acl is_ms4  path_beg /api/analytics

    use_backend ms1_back  if is_ms1
    use_backend ms2_back  if is_ms2
    use_backend ms3_back  if is_ms3
    use_backend ms4_back  if is_ms4

    default_backend no_match

# ── Backends ──────────────────────────────────────────────────────────────────

backend ms1_back
    balance roundrobin
    option  tcp-check
    server-template ms1_ 5 microservicios-docker_MS1:3000 check inter 10s rise 2 fall 3 resolvers docker_dns resolve-opts prevent-dup-ip init-addr none

backend ms2_back
    balance roundrobin
    option  tcp-check
    server-template ms2_ 5 microservicios-docker_MS2:3001 check inter 10s rise 2 fall 3 resolvers docker_dns resolve-opts prevent-dup-ip init-addr none

backend ms3_back
    balance roundrobin
    option  tcp-check
    server-template ms3_ 5 microservicios-docker_MS3:3002 check inter 10s rise 2 fall 3 resolvers docker_dns resolve-opts prevent-dup-ip init-addr none

backend ms4_back
    balance roundrobin
    option  tcp-check
    timeout server 300s
    server-template ms4_ 5 microservicios-docker_MS4:3003 check inter 15s rise 2 fall 3 resolvers docker_dns resolve-opts prevent-dup-ip init-addr none

backend no_match
    errorfile 503 /usr/local/etc/haproxy/errors/503.http
